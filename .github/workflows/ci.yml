name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Self-contained on purpose: this runs identically on a developer machine,
      # so a failure here can always be reproduced locally.
      - name: Scan every commit for credential literals
        run: |
          set -euo pipefail
          if git grep -nIE '[0-9a-f]{64}|at_[A-Za-z0-9]{20,}' \
               $(git rev-list --all) \
               -- '*.py' '*.toml' '*.md' '*.yml' '*.yaml' '*.txt' '*.cfg' '*.json'
          then
            echo "::error::Credential-shaped literal found in history (see above)."
            exit 1
          fi
          echo "No credential literals found in any commit."
